name: Deploy to GitHub Pages

on:
  push:
    branches: [main, astro-static-site]
  schedule:
    # Pages prune past events in the browser, so listings stay honest between
    # deploys on their own. What still needs a build is the *supply*: recurring
    # events are expanded with a 12-month horizon, and each page bakes in a
    # fixed buffer of upcoming occurrences. This tops both up during quiet
    # months. 08:00 UTC is 00:00 PST / 01:00 PDT — the same calendar day in
    # Portland year round, which keeps the build's idea of "today" aligned with
    # the neighborhood's.
    #
    # Note: GitHub disables scheduled workflows after 60 days with no repo
    # activity. Pushes here are frequent enough that this shouldn't bite.
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # reading past runs, for the freshness check below

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.freshness.outputs.stale }}
    steps:
      # Kept as a step rather than its own job so pushes don't pay a second
      # runner spin-up for a check that only ever matters on the monthly cron.
      - name: Decide whether this run needs to build
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Triggered by ${{ github.event_name }} — building."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This run is still in progress, so it can't match status=success and
          # won't mask an older build.
          last=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$last" ]; then
            echo "No previous successful build found — building."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cutoff=$(date -u -d '14 days ago' +%s)
          last_ts=$(date -u -d "$last" +%s)

          if [ "$last_ts" -ge "$cutoff" ]; then
            echo "Last build $last is under 14 days old — skipping."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last build $last is over 14 days old — building."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.freshness.outputs.stale == 'true'
        run: npm ci

      - name: Build Astro site
        if: steps.freshness.outputs.stale == 'true'
        run: npm run build

      - name: Upload artifact
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Nothing was uploaded when the freshness check short-circuits, so deploying
    # would just fail looking for the artifact.
    if: needs.build.outputs.built == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
